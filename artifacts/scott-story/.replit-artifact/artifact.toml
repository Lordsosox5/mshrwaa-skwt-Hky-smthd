kind = "mobile"
previewPath = "/"
title = "مشروع سكوت"
description = "A native Arabic-first reading app for the supernatural novel مشروع سكوت. Read the full story across its chapters with story-inspired AI illustrations, adjustable reading controls, and locally saved reading progress."
version = "1.0.0"
id = "artifacts/scott-story"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23215

[services.development]
run = "pnpm --filter @workspace/scott-story run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scott-story", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/scott-story", "run", "serve" ]

[services.env]
PORT = "23215"
BASE_PATH = "/"
